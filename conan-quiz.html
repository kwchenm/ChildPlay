<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>名偵探問答大挑戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1a2233;
    --navy-light: #263349;
    --gold: #e8c25f;
    --gold-dark: #c79f3a;
    --red: #d64545;
    --green: #4caf7d;
    --paper: #f4ecd8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    font-family: 'Baloo 2', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    background: radial-gradient(circle at 20% 0%, #2c3a54 0%, var(--navy) 55%, #10141d 100%);
    color: var(--paper);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    overflow-x: hidden;
  }
  #app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  header {
    width: 100%;
    max-width: 760px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 8px;
  }
  .home-link {
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    color: var(--navy);
    background: var(--gold);
    border-radius: 20px;
    padding: 8px 14px;
    white-space: nowrap;
    box-shadow: 0 3px 0 rgba(0,0,0,0.3);
  }
  h1 {
    font-size: clamp(18px, 3.6vw, 26px);
    margin: 0;
    color: var(--gold);
    text-align: center;
    text-shadow: 0 2px 0 rgba(0,0,0,0.4);
  }
  .score-pill {
    font-weight: 800;
    background: var(--navy-light);
    border: 2px solid var(--gold-dark);
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 15px;
    white-space: nowrap;
  }

  .panel {
    width: 100%;
    max-width: 760px;
    background: var(--navy-light);
    border: 2px solid var(--gold-dark);
    border-radius: 24px;
    padding: 28px 22px;
    box-shadow: 0 10px 0 rgba(0,0,0,0.3);
  }

  /* ---- Start screen ---- */
  .start-screen { text-align: center; }
  .start-screen .big-emoji { font-size: 64px; margin-bottom: 8px; }
  .start-screen h2 { color: var(--gold); font-size: clamp(20px, 4vw, 28px); margin: 0 0 10px; }
  .start-screen p { color: #cbb98a; line-height: 1.6; margin: 0 0 24px; }
  .start-btn {
    font-family: inherit;
    font-weight: 800;
    font-size: 20px;
    color: var(--navy);
    background: var(--gold);
    border: none;
    border-radius: 30px;
    padding: 14px 40px;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--gold-dark);
    transition: transform 0.12s ease;
  }
  .start-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--gold-dark); }

  /* ---- Quiz screen ---- */
  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    font-size: 14px;
    color: #cbb98a;
    font-weight: 700;
  }
  .progress-bar {
    width: 100%;
    height: 10px;
    background: #10141d;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dark), var(--gold));
    transition: width 0.3s ease;
  }
  .question-text {
    font-size: clamp(17px, 3.4vw, 22px);
    font-weight: 800;
    color: var(--paper);
    line-height: 1.5;
    margin-bottom: 20px;
    min-height: 3em;
  }
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 480px) {
    .options { grid-template-columns: 1fr; }
  }
  .option-btn {
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--navy);
    border: 2px solid #3a4a68;
    border-radius: 16px;
    padding: 14px 16px;
    color: var(--paper);
    font-size: clamp(14px, 2.6vw, 16px);
    font-weight: 700;
    cursor: pointer;
    text-align: left;
    transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .option-btn:active { transform: scale(0.98); }
  .option-btn .opt-icon { font-size: 26px; flex-shrink: 0; }
  .option-btn.correct { background: var(--green); border-color: #2e7d54; color: #0e2318; }
  .option-btn.wrong { background: var(--red); border-color: #8f2b2b; color: #350c0c; }
  .option-btn.disabled { pointer-events: none; opacity: 0.55; }
  .option-btn.disabled.correct, .option-btn.disabled.wrong { opacity: 1; }

  .feedback {
    margin-top: 16px;
    min-height: 28px;
    text-align: center;
    font-weight: 800;
    font-size: 16px;
  }
  .feedback.correct-text { color: var(--green); }
  .feedback.wrong-text { color: #ff8f8f; }

  /* ---- Result screen ---- */
  .result-screen { text-align: center; }
  .grade-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--gold) 0%, var(--gold-dark) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.35);
  }
  .grade-circle .grade-letter {
    font-size: 64px;
    font-weight: 800;
    color: var(--navy);
  }
  .result-screen .result-score {
    font-size: 20px;
    font-weight: 800;
    color: var(--gold);
    margin-bottom: 6px;
  }
  .result-screen .result-comment {
    color: #cbb98a;
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 24px;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
  }
  .result-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .retry-btn {
    font-family: inherit;
    font-weight: 800;
    font-size: 16px;
    color: var(--navy);
    background: var(--gold);
    border: none;
    border-radius: 24px;
    padding: 12px 26px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--gold-dark);
  }
  .retry-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--gold-dark); }

  footer { margin-top: 22px; font-size: 12px; color: #7a6b4e; text-align: center; max-width: 700px; }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="home-link" href="index.html">🏠 選遊戲</a>
    <h1>🕵️ 名偵探問答大挑戰</h1>
    <div class="score-pill" id="scorePill">分數 0</div>
  </header>

  <div class="panel">
    <!-- Start screen -->
    <div class="start-screen" id="startScreen">
      <div class="big-emoji">🔍🎩</div>
      <h2>歡迎來到名偵探問答大挑戰!</h2>
      <p>
        題庫共 100 題,每次隨機挑戰 10 題。<br>
        答對一題 <b style="color:#4caf7d">+10 分</b>,答錯一題 <b style="color:#ff8f8f">-5 分</b>。<br>
        全部答完後,看看你能拿到 S / A / B / C / D / E 哪個等級!
      </p>
      <button class="start-btn" id="startBtn">開始挑戰 ▶</button>
    </div>

    <!-- Quiz screen -->
    <div id="quizScreen" hidden>
      <div class="progress-row">
        <span id="progressText">第 1 / 10 題</span>
        <span id="livePill">目前分數:0</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:10%"></div></div>
      <div class="question-text" id="questionText"></div>
      <div class="options" id="optionsBox"></div>
      <div class="feedback" id="feedback"></div>
    </div>

    <!-- Result screen -->
    <div class="result-screen" id="resultScreen" hidden>
      <div class="grade-circle"><span class="grade-letter" id="gradeLetter">S</span></div>
      <div class="result-score" id="resultScore">分數:0 / 100</div>
      <div class="result-comment" id="resultComment"></div>
      <div class="result-actions">
        <button class="retry-btn" id="retryBtn">🔁 再挑戰一次</button>
      </div>
    </div>
  </div>

  <footer>柯南主題問答題庫為原創題目,僅供家庭同樂使用;所有相關角色版權皆屬原作者青山剛昌與小學館所有。</footer>
</div>

  var ROUND_SIZE = 10;
  var CORRECT_POINTS = 10;
  var WRONG_POINTS = -5;

  // ---------- State ----------
  var roundQuestions = [];
  var currentIndex = 0;
  var score = 0;
  var locked = false;

  // ---------- DOM ----------
  var startScreen = document.getElementById("startScreen");
  var quizScreen = document.getElementById("quizScreen");
  var resultScreen = document.getElementById("resultScreen");
  var startBtn = document.getElementById("startBtn");
  var retryBtn = document.getElementById("retryBtn");
  var progressText = document.getElementById("progressText");
  var progressFill = document.getElementById("progressFill");
  var livePill = document.getElementById("livePill");
  var scorePill = document.getElementById("scorePill");
  var questionText = document.getElementById("questionText");
  var optionsBox = document.getElementById("optionsBox");
  var feedback = document.getElementById("feedback");
  var gradeLetter = document.getElementById("gradeLetter");
  var resultScore = document.getElementById("resultScore");
  var resultComment = document.getElementById("resultComment");

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function buildRound() {
    var picked = shuffle(BANK).slice(0, ROUND_SIZE);
    roundQuestions = picked.map(function (item) {
      var opts = item.opts.map(function (text, idx) {
        return { text: text, isCorrect: idx === item.correct };
      });
      opts = shuffle(opts);
      return { q: item.q, cat: item.cat, opts: opts };
    });
  }

  function startQuiz() {
    buildRound();
    currentIndex = 0;
    score = 0;
    updateScorePill();
    startScreen.hidden = true;
    resultScreen.hidden = true;
    quizScreen.hidden = false;
    renderQuestion();
  }

  function updateScorePill() {
    scorePill.textContent = "分數 " + score;
    livePill.textContent = "目前分數:" + score;
  }

  function renderQuestion() {
    locked = false;
    feedback.textContent = "";
    feedback.className = "feedback";
    var total = roundQuestions.length;
    var qd = roundQuestions[currentIndex];
    progressText.textContent = "第 " + (currentIndex + 1) + " / " + total + " 題";
    progressFill.style.width = Math.round(((currentIndex + 1) / total) * 100) + "%";
    questionText.textContent = qd.q;
    optionsBox.innerHTML = "";
    qd.opts.forEach(function (opt) {
      var btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerHTML = '<span class="opt-icon">' + getIcon(opt.text, qd.cat) + '</span><span>' + opt.text + '</span>';
      btn.addEventListener("click", function () { onAnswer(opt, btn); });
      optionsBox.appendChild(btn);
    });
  }

  function onAnswer(opt, btnEl) {
    if (locked) return;
    locked = true;
    var allBtns = optionsBox.querySelectorAll(".option-btn");
    allBtns.forEach(function (b) { b.classList.add("disabled"); });

    if (opt.isCorrect) {
      btnEl.classList.add("correct");
      score += CORRECT_POINTS;
      feedback.textContent = "✅ 答對了!+10 分";
      feedback.className = "feedback correct-text";
    } else {
      btnEl.classList.add("wrong");
      score += WRONG_POINTS;
      feedback.textContent = "❌ 答錯了,-5 分";
      feedback.className = "feedback wrong-text";
      allBtns.forEach(function (b, idx) {
        if (roundQuestions[currentIndex].opts[idx].isCorrect) {
          b.classList.add("correct");
        }
      });
    }
    updateScorePill();

    setTimeout(function () {
      currentIndex += 1;
      if (currentIndex >= roundQuestions.length) {
        showResult();
      } else {
        renderQuestion();
      }
    }, 1300);
  }

  function gradeFor(finalScore) {
    var s = Math.max(0, finalScore);
    if (s >= 90) return { letter: "S", comment: "神級柯南迷!你的推理力根本就是名偵探等級,江戶川柯南看到你都要甘拜下風!" };
    if (s >= 75) return { letter: "A", comment: "超強柯南通!對案件的細節瞭若指掌,已經是少年偵探團的核心戰力了。" };
    if (s >= 60) return { letter: "B", comment: "資深柯南迷!大部分的線索都難不倒你,再累積一些細節就能更上一層樓。" };
    if (s >= 45) return { letter: "C", comment: "普通柯南觀眾,基本劇情都知道,再多看幾集、多留意細節就能進步!" };
    if (s >= 30) return { letter: "D", comment: "入門柯南迷,對主要角色還算熟悉,建議再多認識一下黑衣組織的成員們。" };
    return { letter: "E", comment: "看來需要重新回去複習案件囉!找時間再多看幾集名偵探柯南,下次一定會更好!" };
  }

  function showResult() {
    quizScreen.hidden = true;
    resultScreen.hidden = false;
    var maxScore = ROUND_SIZE * CORRECT_POINTS;
    var g = gradeFor(score);
    gradeLetter.textContent = g.letter;
    resultScore.textContent = "分數:" + score + " / " + maxScore;
    resultComment.textContent = g.comment;
  }

  startBtn.addEventListener("click", startQuiz);
  retryBtn.addEventListener("click", startQuiz);
})();
