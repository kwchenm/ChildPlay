<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>下樓梯大冒險 - ChildPlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    font-family: 'Baloo 2', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    background: linear-gradient(160deg, #fff3d6 0%, #cdeeff 50%, #ffe0ec 100%);
    overflow-x: hidden;
    user-select: none;
  }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 18px; }
  .screen { width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; }
  .hidden { display: none !important; }

  h1 { font-size: clamp(22px, 5vw, 32px); color: #6b3f2a; text-shadow: 2px 2px 0 #fff8ea; margin: 4px 0 4px; text-align: center; }
  .subtitle { color: #9c7a5e; font-weight: 700; margin-bottom: 18px; text-align: center; font-size: 14px; }
  .backlink { align-self: flex-start; color: #6b3f2a; font-weight: 800; text-decoration: none; margin-bottom: 6px; font-size: 14px; }
  .backlink:active { opacity: 0.6; }

  .highscore-badge {
    background: #fff8ea; border: 2px solid #f0c987; border-radius: 20px;
    padding: 6px 18px; font-weight: 800; color: #a9711f; margin-bottom: 16px; font-size: 15px;
  }

  .level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; }
  .level-btn {
    border: none; border-radius: 16px; padding: 14px 4px; font-family: inherit;
    font-weight: 800; font-size: 16px; color: #fff; cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.18); display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .level-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.18); }
  .level-btn .tag { font-size: 11px; font-weight: 700; opacity: 0.9; }

  /* --- Game screen --- */
  .hud {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px; font-weight: 800; color: #6b3f2a; font-size: 15px; flex-wrap: wrap; gap: 6px;
  }
  .hud-item { background: #fff8ea; border-radius: 14px; padding: 6px 12px; box-shadow: 0 3px 0 rgba(0,0,0,0.08); }
  .hud-lives.low { color: #c0392b; }
  .hud-lives.crit { color: #c0392b; animation: pulse 0.6s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

  #stage {
    position: relative; width: 100%; aspect-ratio: 3 / 4; max-height: 62vh;
    border-radius: 22px; overflow: hidden; border: 4px solid #b98a52;
    background:
      repeating-linear-gradient(135deg, rgba(231,200,145,0.35) 0px, rgba(231,200,145,0.35) 34px, rgba(216,180,119,0.35) 34px, rgba(216,180,119,0.35) 68px),
      linear-gradient(180deg, #cdeeff 0%, #fef6e0 100%);
    box-shadow: 0 8px 0 rgba(0,0,0,0.15);
    touch-action: none;
  }
  #stage.danger #dangerLine { opacity: 1; }
  #dangerLine {
    position: absolute; left: 0; width: 100%; height: 6%; bottom: 0;
    background: repeating-linear-gradient(45deg, #e05252, #e05252 10px, #b93a3a 10px, #b93a3a 20px);
    opacity: 0.55; transition: opacity 0.2s ease;
  }

  .platform {
    position: absolute; height: 8%; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; box-shadow: 0 4px 0 rgba(0,0,0,0.18);
    transform: translate(-50%, -50%);
  }
  .platform.safe { background: linear-gradient(180deg, #e3b56f, #c98f45); }
  .platform.hazard { background: linear-gradient(180deg, #ef8a6e, #d85c3d); }

  #character {
    position: absolute; width: 32px; height: 52px;
    transform: translate(-50%, -100%);
    filter: drop-shadow(2px 3px 2px rgba(0,0,0,0.3));
    z-index: 5;
  }
  #character .c-wrap { position: relative; width: 100%; height: 100%; transition: transform 0.15s ease; }
  #character.lean-left .c-wrap { transform: rotate(-9deg); }
  #character.lean-right .c-wrap { transform: rotate(9deg); }

  #character .c-head {
    position: absolute; top: 0; left: 50%; width: 20px; height: 20px; margin-left: -10px;
    border-radius: 50%; background: #ffd39b; border: 2px solid #6b3f2a;
  }
  #character .c-head::before, #character .c-head::after {
    content: ""; position: absolute; top: 8px; width: 3px; height: 3px;
    background: #3a2a1a; border-radius: 50%;
  }
  #character .c-head::before { left: 5px; }
  #character .c-head::after { right: 5px; }
  #character .c-body {
    position: absolute; top: 17px; left: 50%; width: 16px; height: 18px; margin-left: -8px;
    border-radius: 6px; background: #4c8bf5;
  }
  #character .c-arm {
    position: absolute; top: 18px; width: 6px; height: 15px; border-radius: 4px;
    background: #ffd39b; transform-origin: top center; transform: rotate(0deg);
  }
  #character .c-arm-left { left: 1px; }
  #character .c-arm-right { right: 1px; }
  #character .c-leg {
    position: absolute; top: 33px; width: 7px; height: 18px; border-radius: 4px;
    background: #3a5a8f; transform-origin: top center; transform: rotate(0deg);
  }
  #character .c-leg-left { left: 7px; }
  #character .c-leg-right { right: 7px; }

  @keyframes swing-a { 0%,100% { transform: rotate(-30deg); } 50% { transform: rotate(30deg); } }
  @keyframes swing-b { 0%,100% { transform: rotate(30deg); } 50% { transform: rotate(-30deg); } }
  #character.walking .c-arm-left, #character.walking .c-leg-right { animation: swing-a 0.3s ease-in-out infinite; }
  #character.walking .c-arm-right, #character.walking .c-leg-left { animation: swing-b 0.3s ease-in-out infinite; }
  #character.falling .c-arm-left { transform: rotate(-55deg); }
  #character.falling .c-arm-right { transform: rotate(55deg); }
  #character.falling .c-leg-left { transform: rotate(18deg); }
  #character.falling .c-leg-right { transform: rotate(-18deg); }

  #character.squish .c-wrap { animation: squish 0.22s ease; }
  @keyframes squish {
    0% { transform: scale(1, 1); }
    40% { transform: scale(1.25, 0.75); }
    100% { transform: scale(1, 1); }
  }
  #character.hurt-blink { animation: blink 0.15s steps(1) 4; }
  @keyframes blink { 50% { opacity: 0.25; } }
  #stage.flash-hurt::after {
    content: ""; position: absolute; inset: 0; background: rgba(220,60,60,0.35);
    animation: flashfade 0.35s ease-out forwards; pointer-events: none;
  }
  @keyframes flashfade { from { opacity: 1; } to { opacity: 0; } }

  .controls { display: flex; justify-content: center; gap: 40px; margin-top: 16px; }
  .ctrl-btn {
    width: 78px; height: 78px; border-radius: 50%; border: none;
    background: #6b3f2a; color: #fff; font-size: 30px; box-shadow: 0 6px 0 rgba(0,0,0,0.2);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .ctrl-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .kb-hint { text-align: center; color: #9c7a5e; font-size: 12px; margin-top: 8px; font-weight: 700; }

  /* --- End overlay --- */
  #endOverlay {
    position: fixed; inset: 0; background: rgba(30, 20, 10, 0.55);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .end-card {
    background: #fff8ea; border-radius: 26px; padding: 30px 26px; max-width: 380px; width: 100%;
    text-align: center; box-shadow: 0 10px 0 rgba(0,0,0,0.2);
  }
  .end-card h2 { margin: 0 0 6px; color: #6b3f2a; font-size: 26px; }
  .end-card .score-line { font-size: 18px; font-weight: 800; color: #a9711f; margin: 10px 0; }
  .end-card .newrecord { color: #d84315; font-weight: 800; margin-bottom: 8px; }
  .end-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .end-btn {
    border: none; border-radius: 16px; padding: 14px; font-family: inherit; font-weight: 800;
    font-size: 16px; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,0.18); color: #fff;
  }
  .end-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.18); }
  .btn-primary { background: #4caf50; }
  .btn-secondary { background: #6b8fc9; }
  .btn-tertiary { background: #b98a52; }

  .confetti-piece {
    position: fixed; top: -20px; width: 10px; height: 14px; z-index: 60; pointer-events: none;
    animation: confetti-fall linear forwards;
  }
  @keyframes confetti-fall {
    to { transform: translateY(105vh) rotate(600deg); opacity: 0.9; }
  }
</style>
</head>
<body>
<div id="app">

  <div class="screen" id="levelSelectScreen">
    <a class="backlink" href="index.html">⬅ 回遊戲選單</a>
    <h1>🪜 下樓梯大冒險</h1>
    <div class="subtitle">左右移動閃避障礙、踩穩階梯往下掉!❤️ 30 條命,關卡越高掉得越快</div>
    <div class="highscore-badge">🏆 歷史最高分:<span id="highscoreVal">0</span></div>
    <div class="level-grid" id="levelGrid"></div>
  </div>

  <div class="screen hidden" id="gameScreen">
    <a class="backlink" href="#" id="backToSelect">⬅ 返回選關卡</a>
    <div class="hud">
      <div class="hud-item" id="hudLevel">第 1 關</div>
      <div class="hud-item hud-lives" id="hudLives">❤️ x30</div>
      <div class="hud-item" id="hudScore">⭐ 0</div>
      <div class="hud-item" id="hudDepth">🪜 0/15</div>
    </div>
    <div id="stage">
      <div id="dangerLine"></div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="btnLeft">◀</button>
      <button class="ctrl-btn" id="btnRight">▶</button>
    </div>
    <div class="kb-hint">按住鍵盤方向鍵 ← → 或按鈕移動,角色會自動往下掉</div>
  </div>

</div>

<script>
(function () {
  "use strict";

  var HIGHSCORE_KEY = "childplay_stair_highscore";
  var TARGET_LANDINGS = 15;
  var CHAR_SPEED = 78;        // %/sec horizontal
  var DETACH_Y = 26;          // screen % above which a resting platform releases the character
  var DANGER_Y = 94;          // screen % - falling past this costs a life
  var LANDING_BAND = 3;       // screen % proximity band for landing detection
  var RESCUE_Y = 46;          // screen % to reset the character to after a fall/hit
  var START_PLATFORM_Y = 60;
  var PLATFORM_SAFE_W = 26;
  var PLATFORM_HAZARD_W = 20;
  var PLATFORM_H = 8;         // matches the .platform CSS height (%), used to find its top surface
  var PLATFORM_HALF_H = PLATFORM_H / 2;
  var ROW_GAP = 15;           // target vertical spacing (%) between spawned platforms
  var MAX_X_SHIFT = 42;       // max horizontal wander (%) between consecutive spawns
  var INVULN_MS = 650;
  var RAMP_PER_SEC = 0.55;    // %/sec the shaft speeds up for every second survived in a level
  var RAMP_CAP_MULT = 2.0;    // the time-based ramp never exceeds this multiple of the level's base speed

  function platformTopY(pl) { return pl.y - PLATFORM_HALF_H; }

  var LEVELS = [];
  for (var i = 1; i <= 10; i++) {
    LEVELS.push({
      level: i,
      scrollSpeed: 15 + (i - 1) * 2.3,
      fallMultiplier: 2.1,
      hazardChance: Math.min(0.34, 0.13 + (i - 1) * 0.022)
    });
  }
  var LEVEL_TAGS = ["超慢速","慢速","慢中速","中速","中速+","偏快","快速","快速+","超快速","極限速"];
  var LEVEL_COLORS = ["#7dc36b","#6bc3a0","#5eb3c9","#5e97c9","#6b7fd6","#8a6bd6","#b06bd6","#d66bb0","#d68a6b","#d65e5e"];

  function getHighscore() {
    try {
      var v = parseInt(localStorage.getItem(HIGHSCORE_KEY), 10);
      return isNaN(v) ? 0 : v;
    } catch (e) { return 0; }
  }
  function setHighscore(v) {
    try { localStorage.setItem(HIGHSCORE_KEY, String(v)); } catch (e) {}
  }

  // ---- Audio ----
  var audioCtx = null;
  function ctx() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    return audioCtx;
  }
  function beep(freq, dur, type, delay, vol) {
    var ac = ctx();
    if (!ac) return;
    var t0 = ac.currentTime + (delay || 0);
    var osc = ac.createOscillator();
    var gain = ac.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol == null ? 0.18 : vol, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain).connect(ac.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  function playLandSound() { beep(620, 0.09, "triangle", 0, 0.12); }
  function playHazardSound() { beep(180, 0.22, "sawtooth", 0, 0.15); }
  function speakOuch() {
    try {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance("嗚啊");
      u.lang = "zh-TW";
      u.rate = 1.15;
      u.pitch = 1.05;
      u.volume = 1;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  function playLevelClearFanfare() {
    var notes = [523, 659, 784, 1046];
    notes.forEach(function (f, idx) { beep(f, 0.22, "triangle", idx * 0.13, 0.16); });
  }
  function playGameOverSound() {
    beep(300, 0.25, "sawtooth", 0, 0.15);
    beep(200, 0.3, "sawtooth", 0.2, 0.15);
  }

  function spawnConfetti(n) {
    var colors = ["#ff6b6b","#feca57","#48dbfb","#1dd1a1","#ff9ff3","#a29bfe"];
    for (var i = 0; i < n; i++) {
      (function () {
        var el = document.createElement("div");
        el.className = "confetti-piece";
        el.style.left = (Math.random() * 100) + "vw";
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        var dur = 1.6 + Math.random() * 1.2;
        el.style.animationDuration = dur + "s";
        el.style.opacity = "1";
        document.body.appendChild(el);
        setTimeout(function () { el.remove(); }, dur * 1000 + 100);
      })();
    }
  }

  // ---- DOM refs ----
  var levelSelectScreen = document.getElementById("levelSelectScreen");
  var gameScreen = document.getElementById("gameScreen");
  var levelGrid = document.getElementById("levelGrid");
  var highscoreVal = document.getElementById("highscoreVal");
  var stage = document.getElementById("stage");
  var hudLevel = document.getElementById("hudLevel");
  var hudLives = document.getElementById("hudLives");
  var hudScore = document.getElementById("hudScore");
  var hudDepth = document.getElementById("hudDepth");
  var btnLeft = document.getElementById("btnLeft");
  var btnRight = document.getElementById("btnRight");
  var backToSelect = document.getElementById("backToSelect");

  highscoreVal.textContent = getHighscore();

  LEVELS.forEach(function (cfg, idx) {
    var btn = document.createElement("button");
    btn.className = "level-btn";
    btn.style.background = LEVEL_COLORS[idx];
    btn.innerHTML = "第" + cfg.level + "關<span class=\"tag\">" + LEVEL_TAGS[idx] + "</span>";
    btn.addEventListener("click", function () { startLevel(cfg.level); });
    levelGrid.appendChild(btn);
  });

  // ---- Game state ----
  var state = null;
  var rafId = null;
  var leftHeld = false, rightHeld = false;

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function showGameScreen() {
    levelSelectScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");
  }
  function showLevelSelectScreen() {
    gameScreen.classList.add("hidden");
    levelSelectScreen.classList.remove("hidden");
    highscoreVal.textContent = getHighscore();
  }

  function makePlatformEl(type) {
    var el = document.createElement("div");
    el.className = "platform " + type;
    el.style.width = (type === "safe" ? PLATFORM_SAFE_W : PLATFORM_HAZARD_W) + "%";
    if (type === "hazard") el.textContent = "🪨";
    stage.appendChild(el);
    return el;
  }

  function spawnPlatform() {
    var isHazard = Math.random() < state.cfg.hazardChance;
    var type = isHazard ? "hazard" : "safe";
    var prevX = state.lastSpawnX;
    var x = clamp(prevX + (Math.random() * 2 - 1) * MAX_X_SHIFT, 12, 88);
    var el = makePlatformEl(type);
    var p = { x: x, y: 106, w: isHazard ? PLATFORM_HAZARD_W : PLATFORM_SAFE_W, type: type, el: el };
    el.style.left = x + "%";
    el.style.top = p.y + "%";
    state.platforms.push(p);
    state.lastSpawnX = x;
  }

  function removePlatform(p) {
    if (p.el && p.el.parentNode) p.el.parentNode.removeChild(p.el);
    var idx = state.platforms.indexOf(p);
    if (idx >= 0) state.platforms.splice(idx, 1);
  }

  function startLevel(levelNum) {
    if (rafId) cancelAnimationFrame(rafId);
    if (state && state.platforms) state.platforms.forEach(removePlatform);

    stage.querySelectorAll(".platform").forEach(function (el) { el.remove(); });
    var characterEl = document.createElement("div");
    characterEl.id = "character";
    characterEl.innerHTML =
      '<div class="c-wrap">' +
        '<div class="c-arm c-arm-left"></div>' +
        '<div class="c-arm c-arm-right"></div>' +
        '<div class="c-body"></div>' +
        '<div class="c-head"></div>' +
        '<div class="c-leg c-leg-left"></div>' +
        '<div class="c-leg c-leg-right"></div>' +
      '</div>';
    stage.appendChild(characterEl);

    var cfg = LEVELS[levelNum - 1];
    state = {
      level: levelNum,
      cfg: cfg,
      lives: 30,
      score: 0,
      landings: 0,
      elapsed: 0,
      charX: 50,
      charY: START_PLATFORM_Y - 14,
      charState: "falling", // "falling" | "resting"
      restingPlatform: null,
      lastPlatform: null,
      lastPlatformUntil: 0,
      invulnUntil: 0,
      platforms: [],
      spawnAcc: 0,
      lastSpawnX: 50,
      lastTime: null,
      running: true,
      ended: false,
      characterEl: characterEl
    };

    // Guaranteed easy starting platform just below spawn point
    var startEl = makePlatformEl("safe");
    var startPlatform = { x: 50, y: START_PLATFORM_Y, w: PLATFORM_SAFE_W, type: "safe", el: startEl };
    startEl.style.left = "50%";
    startEl.style.top = START_PLATFORM_Y + "%";
    state.platforms.push(startPlatform);
    state.lastSpawnX = 50;

    renderCharacter();
    showGameScreen();
    updateHUD();
    stage.classList.remove("danger");
    rafId = requestAnimationFrame(tick);
  }

  function updateHUD() {
    hudLevel.textContent = "第 " + state.level + " 關";
    hudLives.textContent = "❤️ x" + state.lives;
    hudLives.classList.remove("low", "crit");
    if (state.lives <= 5) hudLives.classList.add("crit");
    else if (state.lives <= 12) hudLives.classList.add("low");
    hudScore.textContent = "⭐ " + state.score;
    hudDepth.textContent = "🪜 " + state.landings + "/" + TARGET_LANDINGS;
  }

  function renderCharacter() {
    var el = state.characterEl;
    el.style.left = state.charX + "%";
    el.style.top = state.charY + "%";
    el.classList.toggle("walking", leftHeld || rightHeld);
    el.classList.toggle("falling", state.charState === "falling" && !leftHeld && !rightHeld);
    el.classList.toggle("lean-left", leftHeld && !rightHeld);
    el.classList.toggle("lean-right", rightHeld && !leftHeld);
  }

  function flashHurt() {
    stage.classList.remove("flash-hurt");
    void stage.offsetWidth;
    stage.classList.add("flash-hurt");
    state.characterEl.classList.remove("hurt-blink");
    void state.characterEl.offsetWidth;
    state.characterEl.classList.add("hurt-blink");
  }
  function squishLand() {
    state.characterEl.classList.remove("squish");
    void state.characterEl.offsetWidth;
    state.characterEl.classList.add("squish");
  }

  function isInvulnerable(now) { return now < state.invulnUntil; }

  function takeHit(now) {
    state.lives -= 1;
    state.invulnUntil = now + INVULN_MS;
    playHazardSound();
    speakOuch();
    flashHurt();
    if (state.lives <= 0) {
      state.lives = 0;
      updateHUD();
      return true;
    }
    return false;
  }

  function tick(now) {
    if (!state || !state.running) return;
    if (state.lastTime == null) state.lastTime = now;
    var dt = (now - state.lastTime) / 1000;
    state.lastTime = now;
    if (dt > 0.08) dt = 0.08;

    // The shaft speeds up the longer a level runs, independent of player movement, so the
    // pace keeps climbing on its own and builds tension the way the original NS-SHAFT does.
    state.elapsed += dt;
    var effSpeed = Math.min(
      state.cfg.scrollSpeed * RAMP_CAP_MULT,
      state.cfg.scrollSpeed + RAMP_PER_SEC * state.elapsed
    );

    // horizontal movement
    if (leftHeld) state.charX -= CHAR_SPEED * dt;
    if (rightHeld) state.charX += CHAR_SPEED * dt;
    state.charX = clamp(state.charX, 6, 94);

    // scroll all platforms upward
    var toRemove = [];
    for (var i = 0; i < state.platforms.length; i++) {
      var p = state.platforms[i];
      p.y -= effSpeed * dt;
      p.el.style.top = p.y + "%";
      if (p.y < -10) toRemove.push(p);
    }
    toRemove.forEach(removePlatform);

    // spawn new platforms as the shaft continues
    var spawnInterval = (ROW_GAP / effSpeed) * 1000;
    state.spawnAcc += dt * 1000;
    if (state.spawnAcc >= spawnInterval) {
      state.spawnAcc = 0;
      spawnPlatform();
    }

    var prevY = state.charY;
    var gameEnded = false;

    function detachFromPlatform() {
      state.charState = "falling";
      // Remember the platform we just left so the landing check below doesn't
      // immediately re-land on it while it's still within the landing band.
      state.lastPlatform = state.restingPlatform;
      state.lastPlatformUntil = now + 500;
      state.restingPlatform = null;
    }

    if (state.charState === "resting") {
      if (!state.restingPlatform || state.platforms.indexOf(state.restingPlatform) === -1) {
        state.charState = "falling";
      } else if (Math.abs(state.charX - state.restingPlatform.x) > state.restingPlatform.w / 2) {
        // Walked past the edge of the platform - there's nothing underfoot any more,
        // so gravity takes over immediately instead of letting the character glide
        // sideways in mid-air.
        detachFromPlatform();
      } else {
        state.charY = platformTopY(state.restingPlatform);
        if (state.charY < DETACH_Y) {
          detachFromPlatform();
        }
      }
    }

    if (state.charState === "falling") {
      state.charY += effSpeed * state.cfg.fallMultiplier * dt;

      // Landing check: both the character and the platform move every frame, so instead of
      // testing for an exact crossing between two frames (which can slip through when the
      // platform's own motion shifts the target out of range), land whenever the character
      // is falling downward and comes within a small band of the platform's top surface.
      for (var j = 0; j < state.platforms.length; j++) {
        var pl = state.platforms[j];
        if (pl === state.lastPlatform && now < state.lastPlatformUntil) continue;
        var topY = platformTopY(pl);
        if (prevY <= topY + LANDING_BAND && state.charY >= topY - LANDING_BAND) {
          var halfW = pl.w / 2 + 6;
          if (Math.abs(state.charX - pl.x) < halfW) {
            if (pl.type === "hazard") {
              if (!isInvulnerable(now)) {
                if (takeHit(now)) { gameEnded = true; break; }
              }
              state.charState = "falling";
            } else {
              state.charState = "resting";
              state.restingPlatform = pl;
              state.charY = topY;
              if (!isInvulnerable(now)) {
                state.score += 10;
                state.landings += 1;
                playLandSound();
                squishLand();
              }
            }
            break;
          }
        }
      }
    }

    if (!gameEnded && state.charY >= DANGER_Y && state.charState === "falling") {
      if (!isInvulnerable(now)) {
        if (takeHit(now)) { gameEnded = true; }
      }
      if (!gameEnded) {
        state.charY = RESCUE_Y;
        state.charState = "falling";
      }
    }

    stage.classList.toggle("danger", state.charY > DANGER_Y - 12 && state.charState === "falling");

    renderCharacter();
    updateHUD();

    if (gameEnded) { return endLevel(false); }
    if (state.landings >= TARGET_LANDINGS) { return endLevel(true); }

    rafId = requestAnimationFrame(tick);
  }

  function endLevel(cleared) {
    if (!state || state.ended) return;
    state.ended = true;
    state.running = false;
    if (rafId) cancelAnimationFrame(rafId);

    var isNewRecord = state.score > getHighscore();
    if (isNewRecord) setHighscore(state.score);

    var overlay = document.createElement("div");
    overlay.id = "endOverlay";
    var card = document.createElement("div");
    card.className = "end-card";

    var title = cleared ? "🎉 下樓成功!" : "💪 再接再厲!";
    var html = "<h2>" + title + "</h2>";
    html += "<div class=\"score-line\">本關得分:" + state.score + " 分</div>";
    html += "<div class=\"score-line\">🏆 歷史最高分:" + getHighscore() + "</div>";
    if (isNewRecord) html += "<div class=\"newrecord\">🌟 新紀錄!</div>";
    card.innerHTML = html;

    var actions = document.createElement("div");
    actions.className = "end-actions";

    var retryBtn = document.createElement("button");
    retryBtn.className = "end-btn btn-primary";
    retryBtn.textContent = "🔁 再玩一次";
    retryBtn.addEventListener("click", function () { overlay.remove(); startLevel(state.level); });
    actions.appendChild(retryBtn);

    if (cleared && state.level < 10) {
      var nextBtn = document.createElement("button");
      nextBtn.className = "end-btn btn-secondary";
      nextBtn.textContent = "➡ 下一關";
      nextBtn.addEventListener("click", function () { overlay.remove(); startLevel(state.level + 1); });
      actions.appendChild(nextBtn);
    }

    var selectBtn = document.createElement("button");
    selectBtn.className = "end-btn btn-tertiary";
    selectBtn.textContent = "📋 選關卡";
    selectBtn.addEventListener("click", function () { overlay.remove(); showLevelSelectScreen(); });
    actions.appendChild(selectBtn);

    card.appendChild(actions);
    overlay.appendChild(card);
    document.body.appendChild(overlay);

    if (cleared) {
      playLevelClearFanfare();
      spawnConfetti(36);
    } else {
      playGameOverSound();
    }
  }

  // ---- Controls ----
  function setLeft(v) { leftHeld = v; }
  function setRight(v) { rightHeld = v; }

  document.addEventListener("keydown", function (e) {
    if (gameScreen.classList.contains("hidden")) return;
    if (e.code === "ArrowLeft" || e.code === "KeyA") { setLeft(true); e.preventDefault(); }
    if (e.code === "ArrowRight" || e.code === "KeyD") { setRight(true); e.preventDefault(); }
  });
  document.addEventListener("keyup", function (e) {
    if (e.code === "ArrowLeft" || e.code === "KeyA") setLeft(false);
    if (e.code === "ArrowRight" || e.code === "KeyD") setRight(false);
  });

  function bindHold(btn, setter) {
    btn.addEventListener("pointerdown", function (e) { e.preventDefault(); setter(true); });
    btn.addEventListener("pointerup", function () { setter(false); });
    btn.addEventListener("pointerleave", function () { setter(false); });
    btn.addEventListener("pointercancel", function () { setter(false); });
  }
  bindHold(btnLeft, setLeft);
  bindHold(btnRight, setRight);

  backToSelect.addEventListener("click", function (e) {
    e.preventDefault();
    if (state) { state.running = false; }
    if (rafId) cancelAnimationFrame(rafId);
    var existingOverlay = document.getElementById("endOverlay");
    if (existingOverlay) existingOverlay.remove();
    showLevelSelectScreen();
  });

})();
</script>
</body>
</html>
