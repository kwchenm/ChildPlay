<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>下樓梯大冒險 - ChildPlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    font-family: 'Baloo 2', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    background: linear-gradient(160deg, #fff3d6 0%, #cdeeff 50%, #ffe0ec 100%);
    overflow-x: hidden;
    user-select: none;
  }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 18px; }
  .screen { width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; }
  .hidden { display: none !important; }

  h1 { font-size: clamp(22px, 5vw, 32px); color: #6b3f2a; text-shadow: 2px 2px 0 #fff8ea; margin: 4px 0 4px; text-align: center; }
  .subtitle { color: #9c7a5e; font-weight: 700; margin-bottom: 18px; text-align: center; font-size: 14px; }
  .backlink { align-self: flex-start; color: #6b3f2a; font-weight: 800; text-decoration: none; margin-bottom: 6px; font-size: 14px; }
  .backlink:active { opacity: 0.6; }

  .highscore-badge {
    background: #fff8ea; border: 2px solid #f0c987; border-radius: 20px;
    padding: 6px 18px; font-weight: 800; color: #a9711f; margin-bottom: 16px; font-size: 15px;
  }

  .level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; }
  .level-btn {
    border: none; border-radius: 16px; padding: 14px 4px; font-family: inherit;
    font-weight: 800; font-size: 16px; color: #fff; cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.18); display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .level-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.18); }
  .level-btn .tag { font-size: 11px; font-weight: 700; opacity: 0.9; }

  /* --- Game screen --- */
  .hud {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px; font-weight: 800; color: #6b3f2a; font-size: 15px; flex-wrap: wrap; gap: 6px;
  }
  .hud-item { background: #fff8ea; border-radius: 14px; padding: 6px 12px; box-shadow: 0 3px 0 rgba(0,0,0,0.08); }
  .hud-lives.low { color: #c0392b; }
  .hud-lives.crit { color: #c0392b; animation: pulse 0.6s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

  #stage {
    position: relative; width: 100%; aspect-ratio: 3 / 4; max-height: 62vh;
    border-radius: 22px; overflow: hidden; border: 4px solid #b98a52;
    background: linear-gradient(180deg, #cdeeff 0%, #fef6e0 100%);
    box-shadow: 0 8px 0 rgba(0,0,0,0.15);
    touch-action: none;
  }

  .stair-row {
    position: absolute; left: 0; width: 100%; height: 10%;
    display: flex; transform: translateY(-50%);
  }
  .stair-cell {
    flex: 1; margin: 0 2%; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; position: relative;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
  }
  .stair-cell.safe { background: #d8a35c; }
  .stair-cell.hazard { background: #e07a5f; }
  .stair-cell.gap { background: transparent; box-shadow: none; }
  .stair-row.current .stair-cell { opacity: 0.35; }

  #character {
    position: absolute; font-size: 40px; line-height: 1;
    transform: translate(-50%, -50%);
    transition: top 0.24s ease, left 0.18s ease;
    filter: drop-shadow(2px 3px 2px rgba(0,0,0,0.3));
    z-index: 5;
  }
  #character.hurt { animation: shake 0.35s; }
  @keyframes shake { 0%,100% { margin-left: 0; } 25% { margin-left: -8px; } 75% { margin-left: 8px; } }
  #stage.flash-hurt::after {
    content: ""; position: absolute; inset: 0; background: rgba(220,60,60,0.35);
    animation: flashfade 0.35s ease-out forwards; pointer-events: none;
  }
  #stage.flash-good::after {
    content: ""; position: absolute; inset: 0; background: rgba(80,200,120,0.25);
    animation: flashfade 0.3s ease-out forwards; pointer-events: none;
  }
  @keyframes flashfade { from { opacity: 1; } to { opacity: 0; } }

  .controls { display: flex; justify-content: center; gap: 40px; margin-top: 16px; }
  .ctrl-btn {
    width: 78px; height: 78px; border-radius: 50%; border: none;
    background: #6b3f2a; color: #fff; font-size: 30px; box-shadow: 0 6px 0 rgba(0,0,0,0.2);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .ctrl-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .kb-hint { text-align: center; color: #9c7a5e; font-size: 12px; margin-top: 8px; font-weight: 700; }

  /* --- End overlay --- */
  #endOverlay {
    position: fixed; inset: 0; background: rgba(30, 20, 10, 0.55);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .end-card {
    background: #fff8ea; border-radius: 26px; padding: 30px 26px; max-width: 380px; width: 100%;
    text-align: center; box-shadow: 0 10px 0 rgba(0,0,0,0.2);
  }
  .end-card h2 { margin: 0 0 6px; color: #6b3f2a; font-size: 26px; }
  .end-card .score-line { font-size: 18px; font-weight: 800; color: #a9711f; margin: 10px 0; }
  .end-card .newrecord { color: #d84315; font-weight: 800; margin-bottom: 8px; }
  .end-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .end-btn {
    border: none; border-radius: 16px; padding: 14px; font-family: inherit; font-weight: 800;
    font-size: 16px; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,0.18); color: #fff;
  }
  .end-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.18); }
  .btn-primary { background: #4caf50; }
  .btn-secondary { background: #6b8fc9; }
  .btn-tertiary { background: #b98a52; }

  .confetti-piece {
    position: fixed; top: -20px; width: 10px; height: 14px; z-index: 60; pointer-events: none;
    animation: confetti-fall linear forwards;
  }
  @keyframes confetti-fall {
    to { transform: translateY(105vh) rotate(600deg); opacity: 0.9; }
  }
</style>
</head>
<body>
<div id="app">

  <div class="screen" id="levelSelectScreen">
    <a class="backlink" href="index.html">⬅ 回遊戲選單</a>
    <h1>🪜 下樓梯大冒險</h1>
    <div class="subtitle">左右移動選安全的樓梯往下走!❤️ 30 條命,關卡越高走得越快</div>
    <div class="highscore-badge">🏆 歷史最高分:<span id="highscoreVal">0</span></div>
    <div class="level-grid" id="levelGrid"></div>
  </div>

  <div class="screen hidden" id="gameScreen">
    <a class="backlink" href="#" id="backToSelect">⬅ 返回選關卡</a>
    <div class="hud">
      <div class="hud-item" id="hudLevel">第 1 關</div>
      <div class="hud-item hud-lives" id="hudLives">❤️ x30</div>
      <div class="hud-item" id="hudScore">⭐ 0</div>
      <div class="hud-item" id="hudDepth">🪜 0/20</div>
    </div>
    <div id="stage"></div>
    <div class="controls">
      <button class="ctrl-btn" id="btnLeft">◀</button>
      <button class="ctrl-btn" id="btnRight">▶</button>
    </div>
    <div class="kb-hint">或使用鍵盤方向鍵 ← →・每隔一小段時間會自動往下走一階</div>
  </div>

</div>

<script>
(function () {
  "use strict";

  var HIGHSCORE_KEY = "childplay_stair_highscore";
  var LANES = 4;
  var LANE_X = [16, 39, 61, 84];
  var ROWS_VISIBLE = 8;
  var ROW_TOP = 8, ROW_BOTTOM = 92;
  var TARGET_DEPTH = 20;

  function rowY(idx) {
    return ROW_TOP + (idx * (ROW_BOTTOM - ROW_TOP) / (ROWS_VISIBLE - 1));
  }

  var LEVELS = [];
  for (var i = 1; i <= 10; i++) {
    LEVELS.push({
      level: i,
      stepInterval: Math.max(650, 1450 - (i - 1) * 90),
      hazardChance: Math.min(0.30, 0.12 + (i - 1) * 0.02),
      gapChance: Math.min(0.20, 0.07 + (i - 1) * 0.014)
    });
  }
  var LEVEL_TAGS = ["超慢速","慢速","慢中速","中速","中速+","偏快","快速","快速+","超快速","極限速"];
  var LEVEL_COLORS = ["#7dc36b","#6bc3a0","#5eb3c9","#5e97c9","#6b7fd6","#8a6bd6","#b06bd6","#d66bb0","#d68a6b","#d65e5e"];

  var HAZARD_EMOJI = "🪨";

  function getHighscore() {
    try {
      var v = parseInt(localStorage.getItem(HIGHSCORE_KEY), 10);
      return isNaN(v) ? 0 : v;
    } catch (e) { return 0; }
  }
  function setHighscore(v) {
    try { localStorage.setItem(HIGHSCORE_KEY, String(v)); } catch (e) {}
  }

  // ---- Audio ----
  var audioCtx = null;
  function ctx() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    return audioCtx;
  }
  function beep(freq, dur, type, delay, vol) {
    var ac = ctx();
    if (!ac) return;
    var t0 = ac.currentTime + (delay || 0);
    var osc = ac.createOscillator();
    var gain = ac.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol == null ? 0.18 : vol, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain).connect(ac.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  function playStepSound() { beep(700, 0.1, "triangle", 0, 0.13); }
  function playHazardSound() { beep(180, 0.22, "sawtooth", 0, 0.15); }
  function playLevelClearFanfare() {
    var notes = [523, 659, 784, 1046];
    notes.forEach(function (f, idx) { beep(f, 0.22, "triangle", idx * 0.13, 0.16); });
  }
  function playGameOverSound() {
    beep(300, 0.25, "sawtooth", 0, 0.15);
    beep(200, 0.3, "sawtooth", 0.2, 0.15);
  }

  function spawnConfetti(n) {
    var colors = ["#ff6b6b","#feca57","#48dbfb","#1dd1a1","#ff9ff3","#a29bfe"];
    for (var i = 0; i < n; i++) {
      (function () {
        var el = document.createElement("div");
        el.className = "confetti-piece";
        el.style.left = (Math.random() * 100) + "vw";
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        var dur = 1.6 + Math.random() * 1.2;
        el.style.animationDuration = dur + "s";
        el.style.opacity = "1";
        document.body.appendChild(el);
        setTimeout(function () { el.remove(); }, dur * 1000 + 100);
      })();
    }
  }

  // ---- DOM refs ----
  var levelSelectScreen = document.getElementById("levelSelectScreen");
  var gameScreen = document.getElementById("gameScreen");
  var levelGrid = document.getElementById("levelGrid");
  var highscoreVal = document.getElementById("highscoreVal");
  var stage = document.getElementById("stage");
  var hudLevel = document.getElementById("hudLevel");
  var hudLives = document.getElementById("hudLives");
  var hudScore = document.getElementById("hudScore");
  var hudDepth = document.getElementById("hudDepth");
  var btnLeft = document.getElementById("btnLeft");
  var btnRight = document.getElementById("btnRight");
  var backToSelect = document.getElementById("backToSelect");

  highscoreVal.textContent = getHighscore();

  // Build level grid
  LEVELS.forEach(function (cfg, idx) {
    var btn = document.createElement("button");
    btn.className = "level-btn";
    btn.style.background = LEVEL_COLORS[idx];
    btn.innerHTML = "第" + cfg.level + "關<span class=\"tag\">" + LEVEL_TAGS[idx] + "</span>";
    btn.addEventListener("click", function () { startLevel(cfg.level); });
    levelGrid.appendChild(btn);
  });

  // ---- Game state ----
  var state = null;
  var rafId = null;

  function clampLane(v) { return Math.max(0, Math.min(LANES - 1, v)); }

  function showGameScreen() {
    levelSelectScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");
  }
  function showLevelSelectScreen() {
    gameScreen.classList.add("hidden");
    levelSelectScreen.classList.remove("hidden");
    highscoreVal.textContent = getHighscore();
  }

  function generateRow(cfg) {
    var lanes = [];
    for (var l = 0; l < LANES; l++) {
      var r = Math.random();
      if (r < cfg.gapChance) lanes.push("gap");
      else if (r < cfg.gapChance + cfg.hazardChance) lanes.push("hazard");
      else lanes.push("safe");
    }
    if (lanes.indexOf("safe") === -1) {
      lanes[Math.floor(Math.random() * LANES)] = "safe";
    }
    return { lanes: lanes };
  }

  function allSafeRow() {
    return { lanes: ["safe", "safe", "safe", "safe"] };
  }

  function buildStageDom() {
    stage.innerHTML = "";
    state.rowEls = [];
    for (var i = 0; i < ROWS_VISIBLE; i++) {
      var rowEl = document.createElement("div");
      rowEl.className = "stair-row";
      rowEl.style.top = rowY(i) + "%";
      for (var l = 0; l < LANES; l++) {
        var cell = document.createElement("div");
        cell.className = "stair-cell";
        rowEl.appendChild(cell);
      }
      stage.appendChild(rowEl);
      state.rowEls.push(rowEl);
    }
    state.characterEl = document.createElement("div");
    state.characterEl.id = "character";
    state.characterEl.textContent = "🧒";
    stage.appendChild(state.characterEl);
  }

  function renderRows() {
    for (var i = 0; i < ROWS_VISIBLE; i++) {
      var row = state.rows[i];
      var rowEl = state.rowEls[i];
      rowEl.classList.toggle("current", i === state.charRowIdx);
      for (var l = 0; l < LANES; l++) {
        var cell = rowEl.children[l];
        var type = row.lanes[l];
        cell.className = "stair-cell " + type;
        cell.textContent = type === "hazard" ? HAZARD_EMOJI : "";
      }
    }
  }

  function renderCharacter() {
    state.characterEl.style.top = rowY(state.charRowIdx) + "%";
    state.characterEl.style.left = LANE_X[state.charLane] + "%";
  }

  function startLevel(levelNum) {
    if (rafId) cancelAnimationFrame(rafId);

    var rows = [allSafeRow()];
    var cfg = LEVELS[levelNum - 1];
    for (var i = 1; i < ROWS_VISIBLE; i++) rows.push(generateRow(cfg));

    state = {
      level: levelNum,
      cfg: cfg,
      lives: 30,
      score: 0,
      depth: 0,
      rows: rows,
      charRowIdx: 0,
      charLane: 1,
      stepAcc: 0,
      lastTime: null,
      running: true,
      ended: false,
      rowEls: null,
      characterEl: null
    };
    buildStageDom();
    renderRows();
    renderCharacter();
    showGameScreen();
    updateHUD();
    rafId = requestAnimationFrame(tick);
  }

  function updateHUD() {
    hudLevel.textContent = "第 " + state.level + " 關";
    hudLives.textContent = "❤️ x" + state.lives;
    hudLives.classList.remove("low", "crit");
    if (state.lives <= 5) hudLives.classList.add("crit");
    else if (state.lives <= 12) hudLives.classList.add("low");
    hudScore.textContent = "⭐ " + state.score;
    hudDepth.textContent = "🪜 " + state.depth + "/" + TARGET_DEPTH;
  }

  function flashStage(good) {
    stage.classList.remove("flash-hurt", "flash-good");
    void stage.offsetWidth;
    stage.classList.add(good ? "flash-good" : "flash-hurt");
    if (!good) {
      state.characterEl.classList.remove("hurt");
      void state.characterEl.offsetWidth;
      state.characterEl.classList.add("hurt");
    }
  }

  function stepDown() {
    var nextIdx = state.charRowIdx + 1;
    var laneType = state.rows[nextIdx].lanes[state.charLane];

    if (laneType === "hazard" || laneType === "gap") {
      state.lives -= 1;
      playHazardSound();
      flashStage(false);
    } else {
      state.score += 10;
      playStepSound();
      flashStage(true);
    }

    state.charRowIdx = nextIdx;
    state.depth += 1;

    if (state.charRowIdx === ROWS_VISIBLE - 1) {
      state.rows.shift();
      state.rows.push(generateRow(state.cfg));
      state.charRowIdx -= 1;
    }

    renderRows();
    renderCharacter();
    updateHUD();

    if (state.lives <= 0) {
      state.lives = 0;
      updateHUD();
      return endLevel(false);
    }
    if (state.depth >= TARGET_DEPTH) {
      return endLevel(true);
    }
  }

  function tick(now) {
    if (!state || !state.running) return;
    if (state.lastTime == null) state.lastTime = now;
    var dt = now - state.lastTime;
    state.lastTime = now;
    if (dt > 200) dt = 200;

    state.stepAcc += dt;
    if (state.stepAcc >= state.cfg.stepInterval) {
      state.stepAcc = 0;
      stepDown();
      if (!state.running) return;
    }

    rafId = requestAnimationFrame(tick);
  }

  function endLevel(cleared) {
    if (!state || state.ended) return;
    state.ended = true;
    state.running = false;
    if (rafId) cancelAnimationFrame(rafId);

    var isNewRecord = state.score > getHighscore();
    if (isNewRecord) setHighscore(state.score);

    var overlay = document.createElement("div");
    overlay.id = "endOverlay";
    var card = document.createElement("div");
    card.className = "end-card";

    var title = cleared ? "🎉 下樓成功!" : "💪 再接再厲!";
    var html = "<h2>" + title + "</h2>";
    html += "<div class=\"score-line\">本關得分:" + state.score + " 分</div>";
    html += "<div class=\"score-line\">🏆 歷史最高分:" + getHighscore() + "</div>";
    if (isNewRecord) html += "<div class=\"newrecord\">🌟 新紀錄!</div>";
    card.innerHTML = html;

    var actions = document.createElement("div");
    actions.className = "end-actions";

    var retryBtn = document.createElement("button");
    retryBtn.className = "end-btn btn-primary";
    retryBtn.textContent = "🔁 再玩一次";
    retryBtn.addEventListener("click", function () { overlay.remove(); startLevel(state.level); });
    actions.appendChild(retryBtn);

    if (cleared && state.level < 10) {
      var nextBtn = document.createElement("button");
      nextBtn.className = "end-btn btn-secondary";
      nextBtn.textContent = "➡ 下一關";
      nextBtn.addEventListener("click", function () { overlay.remove(); startLevel(state.level + 1); });
      actions.appendChild(nextBtn);
    }

    var selectBtn = document.createElement("button");
    selectBtn.className = "end-btn btn-tertiary";
    selectBtn.textContent = "📋 選關卡";
    selectBtn.addEventListener("click", function () { overlay.remove(); showLevelSelectScreen(); });
    actions.appendChild(selectBtn);

    card.appendChild(actions);
    overlay.appendChild(card);
    document.body.appendChild(overlay);

    if (cleared) {
      playLevelClearFanfare();
      spawnConfetti(36);
    } else {
      playGameOverSound();
    }
  }

  // ---- Controls ----
  var lastLaneMove = 0;
  function moveLane(delta) {
    if (!state || !state.running) return;
    var now = Date.now();
    if (now - lastLaneMove < 110) return;
    lastLaneMove = now;
    state.charLane = clampLane(state.charLane + delta);
    renderCharacter();
  }

  document.addEventListener("keydown", function (e) {
    if (gameScreen.classList.contains("hidden")) return;
    if (e.code === "ArrowLeft" || e.code === "KeyA") { moveLane(-1); e.preventDefault(); }
    if (e.code === "ArrowRight" || e.code === "KeyD") { moveLane(1); e.preventDefault(); }
  });

  btnLeft.addEventListener("pointerdown", function (e) { e.preventDefault(); moveLane(-1); });
  btnRight.addEventListener("pointerdown", function (e) { e.preventDefault(); moveLane(1); });

  backToSelect.addEventListener("click", function (e) {
    e.preventDefault();
    if (state) { state.running = false; }
    if (rafId) cancelAnimationFrame(rafId);
    var existingOverlay = document.getElementById("endOverlay");
    if (existingOverlay) existingOverlay.remove();
    showLevelSelectScreen();
  });

})();
</script>
</body>
</html>
