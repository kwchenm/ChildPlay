<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ChildPlay 遊戲選單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    font-family: 'Baloo 2', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    background: linear-gradient(160deg, #fff3d6 0%, #cdeeff 50%, #ffe0ec 100%);
  }
  #app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  h1 {
    font-size: clamp(24px, 5vw, 36px);
    color: #6b3f2a;
    text-shadow: 2px 2px 0 #fff8ea;
    margin: 0 0 6px;
    text-align: center;
  }
  .subtitle {
    color: #9c7a5e;
    font-weight: 700;
    margin-bottom: 32px;
    text-align: center;
  }
  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    justify-content: center;
    max-width: 800px;
  }
  .game-card {
    text-decoration: none;
    width: 280px;
    border-radius: 28px;
    padding: 28px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.12);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .game-card:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(0,0,0,0.12); }
  .game-card .emoji { font-size: 56px; }
  .game-card .title { font-size: 22px; font-weight: 800; text-align: center; }
  .game-card .desc { font-size: 14px; text-align: center; opacity: 0.85; font-weight: 600; }

  .card-toddler { background: #fff2c9; color: #6b3f2a; }
  .card-conan { background: #1f2733; color: #f4e7c9; }
  .card-conan .desc { color: #cbb98a; }
  .card-kuji { background: #7d141d; color: #fff8ea; }
  .card-kuji .desc { color: #f0d5b8; }

  footer { margin-top: 32px; font-size: 13px; color: #9c7a5e; text-align: center; }
</style>
</head>
<body>
<div id="app">
  <h1>🎮 ChildPlay 遊戲選單</h1>
  <div class="subtitle">選一個適合的遊戲開始玩吧!</div>
  <div class="cards">
    <a class="game-card card-toddler" href="toddler-match.html">
      <span class="emoji">🎈</span>
      <span class="title">叮咚配對樂園</span>
      <span class="desc">適合 4 歲・雙語配對遊戲<br>動物 / 海洋生物 / 交通工具</span>
    </a>
    <a class="game-card card-conan" href="conan-quiz.html">
      <span class="emoji">🕵️</span>
      <span class="title">名偵探問答大挑戰</span>
      <span class="desc">適合 12 歲・柯南主題問答<br>100 題題庫・每次挑戰 10 題</span>
    </a>
    <a class="game-card card-kuji" href="ichiban-kuji.html">
      <span class="emoji">🎏</span>
      <span class="title">一番賞線上抽籤</span>
      <span class="desc">100 抽線上一番賞<br>SP・A~E賞・小賞・撕籤動畫煙火慶祝</span>
    </a>
  </div>
  <footer>點選卡片進入遊戲 🎲</footer>
</div>
</body>
</html>
