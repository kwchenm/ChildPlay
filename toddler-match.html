<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>叮咚配對樂園 Ding Dong Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff8fab;
    --yellow: #ffd166;
    --blue: #6ec6ff;
    --green: #8de29a;
    --purple: #c9a6ff;
    --orange: #ffb26b;
    --card-colors: var(--pink), var(--yellow), var(--blue), var(--green), var(--purple), var(--orange);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow-x: hidden;
    font-family: 'Baloo 2', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    background: linear-gradient(160deg, #fff3d6 0%, #cdeeff 50%, #ffe0ec 100%);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }

  header {
    width: 100%;
    max-width: 900px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }

  .home-link {
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    color: #6b3f2a;
    background: #fff;
    border-radius: 20px;
    padding: 8px 14px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.08);
    white-space: nowrap;
  }

  h1 {
    font-size: clamp(20px, 4vw, 32px);
    color: #6b3f2a;
    text-shadow: 2px 2px 0 #fff8ea;
    margin: 0;
  }

  .icon-btn {
    font-size: 26px;
    background: #fff;
    border: 3px solid #fff;
    border-radius: 50%;
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 0 rgba(0,0,0,0.08);
    cursor: pointer;
    transition: transform 0.12s ease;
    flex-shrink: 0;
  }
  .icon-btn:active { transform: scale(0.9); }

  .stars {
    font-size: clamp(16px, 3vw, 22px);
    background: #fff;
    border-radius: 30px;
    padding: 8px 16px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.08);
    color: #b8860b;
    font-weight: 800;
    white-space: nowrap;
  }

  .mode-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
    justify-content: center;
  }

  .mode-btn {
    font-family: inherit;
    font-weight: 800;
    font-size: clamp(13px, 2.4vw, 17px);
    padding: 10px 18px;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.12);
    transition: transform 0.12s ease;
    white-space: nowrap;
  }
  .mode-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.12); }
  .mode-btn.active { background: #6b3f2a; color: #fff; }
  .mode-btn:not(.active) { background: #fff; color: #6b3f2a; }

  .prompt {
    width: 100%;
    max-width: 900px;
    background: #fff;
    border-radius: 24px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    box-shadow: 0 5px 0 rgba(0,0,0,0.08);
    margin-bottom: 20px;
    min-height: 70px;
  }

  .prompt-emoji {
    font-size: clamp(36px, 6vw, 48px);
    animation: floaty 2.4s ease-in-out infinite;
  }

  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .prompt-text {
    font-size: clamp(16px, 3.4vw, 24px);
    font-weight: 800;
    color: #6b3f2a;
    text-align: center;
    line-height: 1.35;
  }
  .prompt-text .en {
    display: block;
    font-size: 0.7em;
    color: #9c7a5e;
    font-weight: 600;
  }

  .replay-btn {
    font-size: 22px;
    background: var(--blue);
    border: none;
    border-radius: 50%;
    width: 48px;
    height: 48px;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.1);
    flex-shrink: 0;
  }
  .replay-btn:active { transform: scale(0.9); }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    width: 100%;
    max-width: 900px;
  }

  .grid.memory-grid {
    grid-template-columns: repeat(4, 1fr);
  }

  @media (max-width: 520px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .grid.memory-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .card {
    aspect-ratio: 1 / 1;
    border-radius: 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    border: none;
    box-shadow: 0 6px 0 rgba(0,0,0,0.12);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    padding: 8px;
  }
  .card:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.12); }

  .card .emoji {
    font-size: clamp(40px, 9vw, 64px);
    line-height: 1;
  }

  .card .label {
    font-size: clamp(11px, 2vw, 14px);
    font-weight: 700;
    color: rgba(0,0,0,0.55);
    text-align: center;
  }
  .card .label .en { display: block; font-weight: 600; opacity: 0.8; }

  .color-blob {
    width: 46%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.15), 0 3px 0 rgba(255,255,255,0.5);
  }

  .count-wrap {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    align-content: center;
    gap: 2px;
    width: 100%;
    height: 68%;
  }
  .count-wrap span {
    font-size: clamp(16px, 4.6vw, 26px);
    line-height: 1;
  }
  .count-num {
    font-size: clamp(12px, 2vw, 15px);
    font-weight: 800;
    color: rgba(0,0,0,0.55);
    background: rgba(255,255,255,0.75);
    border-radius: 10px;
    padding: 1px 10px;
  }

  .mem-card.hidden-face .emoji { font-size: clamp(28px, 6vw, 40px); }
  .mem-card.matched { opacity: 0.5; cursor: default; }

  .prompt-emoji.silhouette {
    filter: brightness(0) saturate(0);
    opacity: 0.82;
  }

  .card.correct-pulse {
    animation: correctPulse 0.7s ease;
  }
  @keyframes correctPulse {
    0% { transform: scale(1); }
    30% { transform: scale(1.18) rotate(-3deg); }
    60% { transform: scale(1.1) rotate(3deg); }
    100% { transform: scale(1); }
  }

  .card.wrong-shake {
    animation: wrongShake 0.4s ease;
  }
  @keyframes wrongShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  .card.dim {
    filter: grayscale(0.3) brightness(0.92);
  }

  footer {
    margin-top: 22px;
    font-size: 13px;
    color: #9c7a5e;
    text-align: center;
  }

  #confetti-layer, #fireworks-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  #confetti-layer { z-index: 50; }
  #fireworks-layer { z-index: 70; }

  .confetti-piece {
    position: absolute;
    top: -20px;
    border-radius: 3px;
    animation: fall linear forwards;
  }

  @keyframes fall {
    to {
      transform: translateY(110vh) rotate(540deg);
      opacity: 0.9;
    }
  }

  .fw-particle {
    position: absolute;
    top: 0;
    left: 0;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    animation: fwPop 900ms ease-out forwards;
  }
  @keyframes fwPop {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
  }

  .celebrate-banner {
    position: fixed;
    top: 18%;
    left: 50%;
    transform: translate(-50%, -20px) scale(0.6);
    background: #fff;
    padding: 18px 34px;
    border-radius: 30px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.12);
    font-size: clamp(24px, 5vw, 40px);
    font-weight: 800;
    color: #ff6b6b;
    z-index: 60;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    text-align: center;
    pointer-events: none;
  }
  .celebrate-banner.show {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }
  .celebrate-banner .en {
    display: block;
    font-size: 0.55em;
    color: #ffa06b;
  }

  .milestone-banner {
    position: fixed;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -10px) scale(0.5);
    background: linear-gradient(135deg, #ffe08a, #ffb347);
    padding: 20px 36px;
    border-radius: 30px;
    box-shadow: 0 10px 0 rgba(0,0,0,0.2);
    font-size: clamp(20px, 4.6vw, 32px);
    font-weight: 800;
    color: #6b3f2a;
    z-index: 80;
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    text-align: center;
    pointer-events: none;
    max-width: 90vw;
  }
  .milestone-banner.show {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }
  .milestone-banner .en {
    display: block;
    font-size: 0.55em;
    color: #8a5a2b;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="home-link" href="index.html">🏠 選遊戲</a>
    <h1>🎈 叮咚配對樂園</h1>
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="stars" id="starCount">⭐ 0</div>
      <button class="icon-btn" id="muteBtn" title="靜音 Mute">🔊</button>
    </div>
  </header>

  <div class="mode-bar">
    <button class="mode-btn active" id="matchModeBtn">🎯 配對 Match</button>
    <button class="mode-btn" id="exploreModeBtn">🔍 探索 Explore</button>
    <button class="mode-btn" id="colorModeBtn">🎨 顏色 Color</button>
    <button class="mode-btn" id="countModeBtn">🔢 數量 Count</button>
    <button class="mode-btn" id="memoryModeBtn">🧩 記憶 Memory</button>
    <button class="mode-btn" id="shapeModeBtn">🔷 形狀 Shape</button>
    <button class="mode-btn" id="letterModeBtn">🔤 字母 Letter</button>
    <button class="mode-btn" id="sizeModeBtn">📏 大小 Size</button>
    <button class="mode-btn" id="shadowModeBtn">🌑 影子 Shadow</button>
    <button class="mode-btn" id="soundModeBtn">🔊 聲音 Sound</button>
  </div>

  <div class="prompt" id="promptBox">
    <span class="prompt-emoji" id="promptEmoji">🐶</span>
    <div class="prompt-text" id="promptText">
      找找看,小狗在哪裡?
      <span class="en">Find the dog!</span>
    </div>
    <button class="replay-btn" id="replayBtn" title="再聽一次">🔁</button>
  </div>

  <div class="grid" id="grid"></div>

  <footer>四歲小朋友的雙語小遊戲 · 十種玩法一起認知學習 🎵</footer>
</div>

<div id="confetti-layer"></div>
<div id="fireworks-layer"></div>
<div class="celebrate-banner" id="banner">太棒了! <span class="en">Great job!</span></div>
<div class="milestone-banner" id="milestoneBanner"></div>

<script>
(function () {
  "use strict";

  // ---------- Data ----------
  const ITEMS = [
    // Farm animals
    { emoji: "🐶", zh: "小狗", en: "Dog" },
    { emoji: "🐱", zh: "小貓", en: "Cat" },
    { emoji: "🐮", zh: "乳牛", en: "Cow" },
    { emoji: "🐷", zh: "小豬", en: "Pig" },
    { emoji: "🐔", zh: "小雞", en: "Chicken" },
    { emoji: "🐑", zh: "綿羊", en: "Sheep" },
    { emoji: "🐴", zh: "小馬", en: "Horse" },
    { emoji: "🐰", zh: "兔子", en: "Rabbit" },
    { emoji: "🦆", zh: "鴨子", en: "Duck" },
    // Sea creatures
    { emoji: "🐟", zh: "小魚", en: "Fish" },
    { emoji: "🐠", zh: "熱帶魚", en: "Tropical Fish" },
    { emoji: "🐳", zh: "鯨魚", en: "Whale" },
    { emoji: "🐬", zh: "海豚", en: "Dolphin" },
    { emoji: "🦀", zh: "螃蟹", en: "Crab" },
    { emoji: "🐙", zh: "章魚", en: "Octopus" },
    { emoji: "🦈", zh: "鯊魚", en: "Shark" },
    // Vehicles
    { emoji: "🚗", zh: "汽車", en: "Car" },
    { emoji: "🚌", zh: "公車", en: "Bus" },
    { emoji: "🚒", zh: "消防車", en: "Fire Truck" },
    { emoji: "🚓", zh: "警車", en: "Police Car" },
    { emoji: "🚕", zh: "計程車", en: "Taxi" },
    { emoji: "✈️", zh: "飛機", en: "Airplane" },
    { emoji: "🚂", zh: "火車", en: "Train" },
    { emoji: "🚲", zh: "腳踏車", en: "Bicycle" },
  ];

  const COLORS = [
    { zh: "紅色", en: "Red", hex: "#ef5350" },
    { zh: "黃色", en: "Yellow", hex: "#ffd166" },
    { zh: "藍色", en: "Blue", hex: "#4dabf7" },
    { zh: "綠色", en: "Green", hex: "#66bb6a" },
    { zh: "紫色", en: "Purple", hex: "#ab7df0" },
    { zh: "橘色", en: "Orange", hex: "#ffa552" },
    { zh: "粉紅色", en: "Pink", hex: "#ff8fab" },
    { zh: "棕色", en: "Brown", hex: "#a9744f" },
  ];

  const COUNT_EMOJIS = ["🍎", "⭐", "🎈", "🍪", "⚽", "🐝", "🌸", "🚗"];

  const SHAPES = [
    { emoji: "⭐", zh: "星星", en: "Star" },
    { emoji: "🔵", zh: "圓形", en: "Circle" },
    { emoji: "🟦", zh: "正方形", en: "Square" },
    { emoji: "🔺", zh: "三角形", en: "Triangle" },
    { emoji: "🔶", zh: "菱形", en: "Diamond" },
    { emoji: "❤️", zh: "愛心", en: "Heart" },
  ];

  const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

  const SIZE_EMOJIS = ["🐘", "⭐", "🎈", "🍎", "🐟", "🚗", "🌟", "🎀"];

  const SOUND_ITEMS = [
    { emoji: "🐶", zh: "小狗", en: "Dog", soundZh: "汪汪!", soundEn: "Woof woof!" },
    { emoji: "🐱", zh: "小貓", en: "Cat", soundZh: "喵喵!", soundEn: "Meow meow!" },
    { emoji: "🐮", zh: "乳牛", en: "Cow", soundZh: "哞~", soundEn: "Moo!" },
    { emoji: "🐷", zh: "小豬", en: "Pig", soundZh: "呼嚕呼嚕!", soundEn: "Oink oink!" },
    { emoji: "🐔", zh: "小雞", en: "Chicken", soundZh: "咕咕咕!", soundEn: "Cluck cluck!" },
    { emoji: "🐑", zh: "綿羊", en: "Sheep", soundZh: "咩咩!", soundEn: "Baa baa!" },
    { emoji: "🐴", zh: "小馬", en: "Horse", soundZh: "噠噠噠!", soundEn: "Neigh!" },
    { emoji: "🦆", zh: "鴨子", en: "Duck", soundZh: "呱呱!", soundEn: "Quack quack!" },
  ];

  const CARD_COLORS = ["#ff8fab", "#ffd166", "#6ec6ff", "#8de29a", "#c9a6ff", "#ffb26b"];
  const ROUND_SIZE = 6;
  const MEMORY_PAIR_COUNT = 4;
  const FIND_MODES = ["match", "color", "count", "shape", "letter", "size", "shadow", "sound"];

  // ---------- State ----------
  let mode = "match"; // one of FIND_MODES, plus "explore" | "memory"
  let currentSet = [];
  let targetIndex = -1;
  let promptEmojiText = "❓";
  let promptSilhouette = false;
  let promptZhText = "";
  let promptEnText = "";
  let stars = 0;
  let locked = false;
  let muted = false;

  // memory-mode state
  let memoryCards = [];
  let memFlipped = [];
  let memLocked = false;

  // ---------- DOM ----------
  const grid = document.getElementById("grid");
  const promptEmoji = document.getElementById("promptEmoji");
  const promptText = document.getElementById("promptText");
  const replayBtn = document.getElementById("replayBtn");
  const starCountEl = document.getElementById("starCount");
  const muteBtn = document.getElementById("muteBtn");
  const matchModeBtn = document.getElementById("matchModeBtn");
  const exploreModeBtn = document.getElementById("exploreModeBtn");
  const colorModeBtn = document.getElementById("colorModeBtn");
  const countModeBtn = document.getElementById("countModeBtn");
  const memoryModeBtn = document.getElementById("memoryModeBtn");
  const shapeModeBtn = document.getElementById("shapeModeBtn");
  const letterModeBtn = document.getElementById("letterModeBtn");
  const sizeModeBtn = document.getElementById("sizeModeBtn");
  const shadowModeBtn = document.getElementById("shadowModeBtn");
  const soundModeBtn = document.getElementById("soundModeBtn");
  const confettiLayer = document.getElementById("confetti-layer");
  const fireworksLayer = document.getElementById("fireworks-layer");
  const banner = document.getElementById("banner");
  const milestoneBanner = document.getElementById("milestoneBanner");

  const MODE_BUTTONS = {
    match: matchModeBtn,
    explore: exploreModeBtn,
    color: colorModeBtn,
    count: countModeBtn,
    memory: memoryModeBtn,
    shape: shapeModeBtn,
    letter: letterModeBtn,
    size: sizeModeBtn,
    shadow: shadowModeBtn,
    sound: soundModeBtn,
  };

  // ---------- Audio: simple tones via WebAudio ----------
  let audioCtx = null;
  function getCtx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    return audioCtx;
  }

  function beep(freq, duration, type, delay, gainVal) {
    if (muted) return;
    const ctx = getCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    gain.gain.value = gainVal != null ? gainVal : 0.15;
    osc.connect(gain);
    gain.connect(ctx.destination);
    const startAt = ctx.currentTime + (delay || 0);
    osc.start(startAt);
    gain.gain.setValueAtTime(gain.gain.value, startAt);
    gain.gain.exponentialRampToValueAtTime(0.001, startAt + duration);
    osc.stop(startAt + duration + 0.02);
  }

  function playTapSound() {
    beep(520, 0.12, "triangle", 0, 0.12);
  }

  function playCorrectSound() {
    // a brighter, more festive "ta-da + sparkle" chime
    beep(523.25, 0.10, "triangle", 0.00, 0.16);  // C5
    beep(659.25, 0.10, "triangle", 0.09, 0.16);  // E5
    beep(783.99, 0.10, "triangle", 0.18, 0.18);  // G5
    beep(1046.50, 0.18, "triangle", 0.27, 0.20); // C6
    beep(1318.51, 0.10, "sine", 0.42, 0.12);     // E6 sparkle
    beep(1567.98, 0.14, "sine", 0.50, 0.12);     // G6 sparkle
  }

  function playGentleOops() {
    beep(300, 0.16, "sine", 0, 0.1);
    beep(240, 0.2, "sine", 0.12, 0.09);
  }

  function playFireworkBoom(delay) {
    beep(90, 0.35, "sine", delay, 0.22);
    beep(70, 0.4, "sine", delay + 0.03, 0.15);
    beep(1568, 0.12, "triangle", delay + 0.12, 0.14);
    beep(2093, 0.10, "triangle", delay + 0.22, 0.12);
  }

  // ---------- Speech ----------
  function speak(text, lang) {
    if (muted) return;
    if (!("speechSynthesis" in window)) return;
    try {
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      utter.rate = 0.95;
      utter.pitch = 1.15;
      window.speechSynthesis.speak(utter);
    } catch (e) { /* speech not available, ignore */ }
  }

  function speakBilingual(zhText, enText) {
    if (muted || !("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const zhUtter = new SpeechSynthesisUtterance(zhText);
    zhUtter.lang = "zh-TW";
    zhUtter.rate = 0.95;
    zhUtter.pitch = 1.15;
    const enUtter = new SpeechSynthesisUtterance(enText);
    enUtter.lang = "en-US";
    enUtter.rate = 0.9;
    enUtter.pitch = 1.15;
    window.speechSynthesis.speak(zhUtter);
    window.speechSynthesis.speak(enUtter);
  }

  // ---------- Helpers ----------
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function pickRoundItems() {
    return shuffle(ITEMS).slice(0, ROUND_SIZE);
  }

  // ---------- Round builders (match / color / count share one "find the target" flow) ----------
  function matchRoundData() {
    const cards = pickRoundItems();
    const idx = Math.floor(Math.random() * cards.length);
    const target = cards[idx];
    return {
      cards,
      targetIndex: idx,
      promptEmoji: "❓",
      promptZh: "找找看," + target.zh + "在哪裡?",
      promptEn: "Find the " + target.en + "!",
    };
  }

  function colorRoundData() {
    const cards = shuffle(COLORS).slice(0, ROUND_SIZE);
    const idx = Math.floor(Math.random() * cards.length);
    const target = cards[idx];
    return {
      cards,
      targetIndex: idx,
      promptEmoji: "🎨",
      promptZh: "找找看," + target.zh + "在哪裡?",
      promptEn: "Find " + target.en + "!",
    };
  }

  function countRoundData() {
    const emoji = COUNT_EMOJIS[Math.floor(Math.random() * COUNT_EMOJIS.length)];
    const counts = shuffle([1, 2, 3, 4, 5, 6]);
    const cards = counts.map((c) => ({ emoji, count: c }));
    const idx = Math.floor(Math.random() * cards.length);
    const target = cards[idx];
    return {
      cards,
      targetIndex: idx,
      promptEmoji: "🔢",
      promptZh: "找找看,哪裡有" + target.count + "個?",
      promptEn: "Find the group of " + target.count + "!",
    };
  }

  function shapeRoundData() {
    const cards = shuffle(SHAPES);
    const idx = Math.floor(Math.random() * cards.length);
    const target = cards[idx];
    return {
      cards,
      targetIndex: idx,
      promptEmoji: "🔷",
      promptZh: "找找看," + target.zh + "在哪裡?",
      promptEn: "Find the " + target.en + "!",
    };
  }

  function letterRoundData() {
    const letters = shuffle(LETTERS).slice(0, ROUND_SIZE);
    const cards = letters.map((ch) => ({ emoji: ch, zh: "字母 " + ch, en: "Letter " + ch }));
    const idx = Math.floor(Math.random() * cards.length);
    const target = cards[idx];
    return {
      cards,
      targetIndex: idx,
      promptEmoji: "🔤",
      promptZh: "找找看,字母 " + target.emoji + " 在哪裡?",
      promptEn: "Find the letter " + target.emoji + "!",
    };
  }

  function sizeRoundData() {
    const emoji = SIZE_EMOJIS[Math.floor(Math.random() * SIZE_EMOJIS.length)];
    const factors = shuffle([0.5, 0.65, 0.8, 0.95, 1.1, 1.3]);
    const cards = factors.map((f) => ({ emoji, factor: f }));
    const askBiggest = Math.random() < 0.5;
    let idx = 0;
    cards.forEach((c, i) => {
      const better = askBiggest ? c.factor > cards[idx].factor : c.factor < cards[idx].factor;
      if (better) idx = i;
    });
    return {
      cards,
      targetIndex: idx,
      promptEmoji: askBiggest ? "⬆️" : "⬇️",
      promptZh: askBiggest ? "找找看,哪一個最大?" : "找找看,哪一個最小?",
      promptEn: askBiggest ? "Find the biggest one!" : "Find the smallest one!",
    };
  }

  function shadowRoundData() {
    const cards = pickRoundItems();
    const idx = Math.floor(Math.random() * cards.length);
    const target = cards[idx];
    return {
      cards,
      targetIndex: idx,
      promptEmoji: target.emoji,
      silhouette: true,
      promptZh: "找找看,這是誰的影子?",
      promptEn: "Whose shadow is this?",
    };
  }

  function soundRoundData() {
    const cards = shuffle(SOUND_ITEMS).slice(0, ROUND_SIZE);
    const idx = Math.floor(Math.random() * cards.length);
    const target = cards[idx];
    return {
      cards,
      targetIndex: idx,
      promptEmoji: "🔊",
      promptZh: target.soundZh + " 是誰在說話?",
      promptEn: target.soundEn + " Who says that?",
    };
  }

  function buildRoundData(m) {
    if (m === "color") return colorRoundData();
    if (m === "count") return countRoundData();
    if (m === "shape") return shapeRoundData();
    if (m === "letter") return letterRoundData();
    if (m === "size") return sizeRoundData();
    if (m === "shadow") return shadowRoundData();
    if (m === "sound") return soundRoundData();
    return matchRoundData();
  }

  function cardInnerHTML(m, item) {
    if (m === "color") {
      return '<span class="color-blob" style="background:' + item.hex + '"></span>' +
        '<span class="label">' + item.zh + '<span class="en">' + item.en + '</span></span>';
    }
    if (m === "count") {
      let spans = "";
      for (let i = 0; i < item.count; i++) spans += "<span>" + item.emoji + "</span>";
      return '<div class="count-wrap">' + spans + '</div><span class="count-num">' + item.count + '</span>';
    }
    // match / explore / shape / letter / size / shadow / sound share this layout;
    // "size" cards scale via item.factor and skip the label to avoid giving away the answer.
    const style = item.factor ? ' style="font-size:' + Math.round(44 * item.factor) + 'px"' : "";
    const label = item.zh != null
      ? '<span class="label">' + item.zh + (item.en != null ? '<span class="en">' + item.en + '</span>' : '') + '</span>'
      : "";
    return '<span class="emoji"' + style + '>' + item.emoji + '</span>' + label;
  }

  // ---------- Rendering (match / explore / color / count) ----------
  function renderGrid() {
    grid.innerHTML = "";
    currentSet.forEach((item, idx) => {
      const btn = document.createElement("button");
      btn.className = "card";
      btn.style.background = CARD_COLORS[idx % CARD_COLORS.length];
      btn.innerHTML = cardInnerHTML(mode, item);
      btn.addEventListener("click", () => onCardTap(idx, btn));
      grid.appendChild(btn);
    });
  }

  function renderPrompt() {
    if (mode === "explore") {
      promptEmoji.textContent = "🔍";
      promptText.innerHTML = '點點看,聽聽這是什麼! <span class="en">Tap and listen!</span>';
      replayBtn.style.visibility = "hidden";
      return;
    }
    if (mode === "memory") {
      promptEmoji.textContent = "🧩";
      promptText.innerHTML = '翻翻看,找出一樣的圖案吧! <span class="en">Flip and find the matching pairs!</span>';
      replayBtn.style.visibility = "hidden";
      return;
    }
    replayBtn.style.visibility = "visible";
    promptEmoji.textContent = promptEmojiText;
    promptEmoji.classList.toggle("silhouette", promptSilhouette);
    promptText.innerHTML = promptZhText + '<span class="en">' + promptEnText + '</span>';
  }

  function announceTarget() {
    if (FIND_MODES.indexOf(mode) !== -1) {
      speakBilingual(promptZhText, promptEnText);
    }
  }

  function newTargetRound(m) {
    locked = false;
    const data = buildRoundData(m);
    currentSet = data.cards;
    targetIndex = data.targetIndex;
    promptEmojiText = data.promptEmoji;
    promptSilhouette = !!data.silhouette;
    promptZhText = data.promptZh;
    promptEnText = data.promptEn;
    renderGrid();
    renderPrompt();
    setTimeout(announceTarget, 300);
  }

  function newExploreSet() {
    currentSet = pickRoundItems();
    targetIndex = -1;
    renderGrid();
    renderPrompt();
  }

  // ---------- Scoring / celebration ----------
  function registerCorrect() {
    stars += 1;
    starCountEl.textContent = "⭐ " + stars;
    if (stars % 5 === 0) {
      setTimeout(fireworksCelebration, 500);
    }
  }

  function celebrate() {
    const phrases = [
      ["太棒了!", "Great job!"],
      ["你好棒!", "Awesome!"],
      ["答對了!", "You got it!"],
      ["好厲害!", "Well done!"],
    ];
    const pick = phrases[Math.floor(Math.random() * phrases.length)];
    banner.innerHTML = pick[0] + ' <span class="en">' + pick[1] + '</span>';
    banner.classList.add("show");
    setTimeout(() => banner.classList.remove("show"), 1200);
    spawnConfetti();
  }

  function spawnConfetti() {
    const colors = CARD_COLORS;
    const count = 26;
    for (let i = 0; i < count; i++) {
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      const size = 6 + Math.random() * 8;
      piece.style.width = size + "px";
      piece.style.height = (size * 1.6) + "px";
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      const duration = 1.6 + Math.random() * 1.2;
      piece.style.animationDuration = duration + "s";
      piece.style.opacity = "0.95";
      confettiLayer.appendChild(piece);
      setTimeout(() => piece.remove(), duration * 1000 + 100);
    }
  }

  function spawnFirework(x, y, color) {
    const count = 16;
    for (let i = 0; i < count; i++) {
      const p = document.createElement("div");
      p.className = "fw-particle";
      const angle = (Math.PI * 2 * i) / count;
      const dist = 70 + Math.random() * 70;
      p.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      p.style.setProperty("--dy", Math.sin(angle) * dist + "px");
      p.style.left = x + "px";
      p.style.top = y + "px";
      p.style.background = color;
      fireworksLayer.appendChild(p);
      setTimeout(() => p.remove(), 950);
    }
  }

  function fireworksCelebration() {
    const fwColors = ["#ff5c5c", "#ffd166", "#4dabf7", "#66bb6a", "#ab7df0", "#ff8fab", "#ffa552"];
    const bursts = 4;
    for (let i = 0; i < bursts; i++) {
      setTimeout(() => {
        const x = window.innerWidth * (0.2 + Math.random() * 0.6);
        const y = window.innerHeight * (0.15 + Math.random() * 0.35);
        const color = fwColors[Math.floor(Math.random() * fwColors.length)];
        spawnFirework(x, y, color);
        playFireworkBoom(0);
      }, i * 260);
    }
    const msgs = [
      ["太厲害了!你連續答對好多題!", "Amazing! You are on a roll!"],
      ["哇!你是小小天才!", "Wow! You are a superstar!"],
      ["繼續加油,你做得好棒!", "Keep going, great job!"],
    ];
    const pick = msgs[Math.floor(Math.random() * msgs.length)];
    milestoneBanner.innerHTML = "🎆 " + pick[0] + ' <span class="en">' + pick[1] + '</span> 🎆';
    milestoneBanner.classList.add("show");
    speakBilingual(pick[0], pick[1]);
    setTimeout(() => milestoneBanner.classList.remove("show"), 2200);
  }

  // ---------- Interaction: match / explore / color / count ----------
  function onCardTap(idx, btnEl) {
    if (mode === "explore") {
      const item = currentSet[idx];
      playTapSound();
      btnEl.classList.remove("correct-pulse");
      void btnEl.offsetWidth;
      btnEl.classList.add("correct-pulse");
      speakBilingual(item.zh, item.en);
      return;
    }

    if (locked) return;
    if (idx === targetIndex) {
      locked = true;
      btnEl.classList.add("correct-pulse");
      playCorrectSound();
      celebrate();
      registerCorrect();
      setTimeout(() => newTargetRound(mode), 1500);
    } else {
      btnEl.classList.add("wrong-shake");
      playGentleOops();
      setTimeout(() => btnEl.classList.remove("wrong-shake"), 400);
    }
  }

  // ---------- Memory mode ----------
  function newMemoryRound() {
    const chosenItems = shuffle(ITEMS).slice(0, MEMORY_PAIR_COUNT);
    let cards = [];
    chosenItems.forEach((it, i) => {
      cards.push({ item: it, uid: i + "-a", revealed: false, matched: false });
      cards.push({ item: it, uid: i + "-b", revealed: false, matched: false });
    });
    memoryCards = shuffle(cards);
    memFlipped = [];
    memLocked = false;
    grid.classList.add("memory-grid");
    renderMemoryGrid();
    renderPrompt();
    speakBilingual("翻翻看,找出一樣的圖案吧!", "Flip and find the matching pairs!");
  }

  function renderMemoryGrid() {
    grid.innerHTML = "";
    memoryCards.forEach((card, idx) => {
      const shown = card.revealed || card.matched;
      const btn = document.createElement("button");
      btn.className = "card mem-card" + (card.matched ? " matched" : "") + (shown ? "" : " hidden-face");
      btn.style.background = shown ? "#fff7e0" : "#c9a6ff";
      btn.innerHTML = shown
        ? '<span class="emoji">' + card.item.emoji + '</span>'
        : '<span class="emoji">❓</span>';
      btn.addEventListener("click", () => onMemoryCardTap(idx));
      grid.appendChild(btn);
    });
  }

  function onMemoryCardTap(idx) {
    if (memLocked) return;
    const card = memoryCards[idx];
    if (card.matched || card.revealed) return;

    card.revealed = true;
    playTapSound();
    renderMemoryGrid();
    memFlipped.push(idx);

    if (memFlipped.length === 2) {
      memLocked = true;
      const c1 = memoryCards[memFlipped[0]];
      const c2 = memoryCards[memFlipped[1]];
      if (c1.item.emoji === c2.item.emoji) {
        c1.matched = true;
        c2.matched = true;
        playCorrectSound();
        speakBilingual(c1.item.zh, c1.item.en);
        registerCorrect();
        memFlipped = [];
        memLocked = false;
        renderMemoryGrid();
        if (memoryCards.every((c) => c.matched)) {
          setTimeout(() => {
            celebrate();
            fireworksCelebration();
            setTimeout(newMemoryRound, 1900);
          }, 300);
        }
      } else {
        playGentleOops();
        setTimeout(() => {
          c1.revealed = false;
          c2.revealed = false;
          memFlipped = [];
          memLocked = false;
          renderMemoryGrid();
        }, 800);
      }
    }
  }

  // ---------- Mode switching ----------
  function setMode(newMode) {
    mode = newMode;
    Object.keys(MODE_BUTTONS).forEach((key) => {
      MODE_BUTTONS[key].classList.toggle("active", key === newMode);
    });
    grid.classList.remove("memory-grid");

    if (newMode === "explore") {
      newExploreSet();
    } else if (newMode === "memory") {
      newMemoryRound();
    } else {
      newTargetRound(newMode);
    }
  }

  matchModeBtn.addEventListener("click", () => setMode("match"));
  exploreModeBtn.addEventListener("click", () => setMode("explore"));
  colorModeBtn.addEventListener("click", () => setMode("color"));
  countModeBtn.addEventListener("click", () => setMode("count"));
  memoryModeBtn.addEventListener("click", () => setMode("memory"));
  shapeModeBtn.addEventListener("click", () => setMode("shape"));
  letterModeBtn.addEventListener("click", () => setMode("letter"));
  sizeModeBtn.addEventListener("click", () => setMode("size"));
  shadowModeBtn.addEventListener("click", () => setMode("shadow"));
  soundModeBtn.addEventListener("click", () => setMode("sound"));
  replayBtn.addEventListener("click", announceTarget);

  muteBtn.addEventListener("click", () => {
    muted = !muted;
    muteBtn.textContent = muted ? "🔇" : "🔊";
    if (muted && "speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }
  });

  // Some browsers require a user gesture before audio/speech works.
  document.body.addEventListener("click", function unlockAudioOnce() {
    getCtx();
    document.body.removeEventListener("click", unlockAudioOnce);
  }, { once: true });

  // ---------- Init ----------
  setMode("match");
})();
</script>
</body>
</html>
